<div class="login-shell">
  <div class="login-card">
    <h2>Iniciar sesión</h2>

    <form (ngSubmit)="ingresar()" #f="ngForm" novalidate>
      <div class="form-group">
        <label class="control-label">Usuario</label>
        <input class="form-control" name="usuario" [(ngModel)]="usuario" autocomplete="username" required />
      </div>

      <div class="form-group">
        <label class="control-label">Contraseña</label>
        <input class="form-control" type="password" name="contrasena" [(ngModel)]="contrasena" autocomplete="current-password" required />
      </div>

      <div *ngIf="error" class="alert alert-warning">{{ error }}</div>

      <button class="btn btn-primary" type="submit" [disabled]="loading || !usuario || !contrasena">
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
