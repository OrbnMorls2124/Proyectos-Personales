<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE AREAS</a>

</nav>

<div class="agregar_contenedor"></div>
<div class="row mt-5">
<div class="card">
    <div class="card-body">
        <div *ngIf="editMode" style="margin-bottom: 12px;">
          <button type="button" class="btn btn-secondary" [routerLink]="['/areastrabajo']">Volver</button>
        </div>
        <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="Guardar()" novalidate >
          <div class="form-group">
            <label for="" class="control-label" hidden>Areas No.</label>
                  <input type="text"  readonly="readonly"  [(ngModel)]="user.idarea" name="idarea" placeholder="No" class="form-control" required hidden>
                  </div>

              <div class="form-group">
              <label for="" class="control-label">Empresa</label>
              <select [(ngModel)]="user.idempresa" name="idempresa" class="form-control" required>
                <option value="">Seleccione una empresa</option>
                <option *ngFor="let emp of empresas" [value]="emp.idempresa">{{emp.nombre}}</option>
              </select>
          </div>
          <div class="form-group">
              <label for="" class="control-label">Sucursal</label>
              <select [(ngModel)]="user.idsuc" name="idsuc" class="form-control" required>
                <option value="">Seleccione una sucursal</option>
                <option *ngFor="let suc of sucursales" [value]="suc.idsuc">{{suc.sucursal}}</option>
              </select>
          </div>
          <div class="form-group">
              <label for="" class="control-label">Area</label>
              <input type="text"  [(ngModel)]="user.area"  name="area" placeholder="DIGITE EL AREA"  class="form-control" autofocus>
              <div ng-show="!user.area && formulario.$submitted" class="alert alert-warning">Digite el Area</div>
          </div>
            <div class="form-group">
              <label for="" class="control-label">Fecha Creacion</label>
              <input type="date"  [(ngModel)]="user.fecha_creacion"  name="fecha_creacion" placeholder="Seleccione la Fecha" class="form-control">
          </div>
          <button type="submit" class="btn" [ngClass]="editMode ? 'btn-update' : 'btn-primary'" formnovalidate value="Save">
              {{ editMode ? 'Actualizar' : 'Agregar' }}
          </button>
        </form>
    </div>
</div>
</div>
<br *ngIf="!editMode">
<div class="container" *ngIf="!editMode">
<div class="row mt-25">
    <div>
      <div class="search-toolbar">
        <label for="buscar-areastrabajo">Buscador</label>
        <input id="buscar-areastrabajo" type="text" [(ngModel)]="searchTerm" (ngModelChange)="filterData()" placeholder="Buscar áreas..." class="form-control">
      </div>

<table>
  <thead>
    <tr>
        <th>NO</th>
        <th>EMPRESA</th>
        <th>SUCURSAL</th>
        <th>AREA</th>
        <th>FECHA CREACION</th>
        <th>ESTADO</th>
        <th>ACCIONES</th>

    </tr>

  </thead>
<tbody >

            <tr *ngFor="let User of filteredTUser">
                <td >{{User.idarea}}</td>
                <td >{{User.empresa}}</td>
                <td >{{User.sucursal}}</td>
                <td >{{User.area}}</td>
                <td >{{User.fecha_creacion | date:'dd/MM/yyyy'}}</td>
                <td >{{User.estado}}</td>
                <td>
                  <button class="btn btn-danger" (click)="EliminarData(User.idarea)">Eliminar</button>
                  <button class="btn btn-update" [routerLink]="['/areastrabajo/edit', User.idarea]">Actualizar</button>
                </td>
              </tr>
 </tbody>
</table>
</div>
</div>
</div>
