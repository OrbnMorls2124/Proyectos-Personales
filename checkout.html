<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
   
  </style>
</head>
<body>
  <div class="container mt-4">
    <h1>Checkout</h1>
    <form>
      
      <h2>Detalles de Envío</h2>   
      <div class="mb-3">
        <label for="inputName" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="inputName" placeholder="Nombre">
      </div>
      <div class="mb-3">
        <label for="inputAddress" class="form-label">Dirección</label>
        <input type="text" class="form-control" id="inputAddress" placeholder="1234 Avenida Principal">
      </div>
      
      
      <h2>Detalles de Pago</h2>
      <div class="mb-3">
        <label for="inputCardNumber" class="form-label">Número de Tarjeta</label>
        <input type="text" class="form-control" id="inputCardNumber" placeholder="1234 5678 9101 1121">
      </div>
      <div class="mb-3">
        <label for="inputExpiration" class="form-label">Fecha de Expiración</label>
        <input type="text" class="form-control" id="inputExpiration" placeholder="MM/AA">
      </div>
      <div class="mb-3">
        <label for="inputCVV" class="form-label">CVV</label>
        <input type="text" class="form-control" id="inputCVV" placeholder="123">
      </div>
      
      <button type="submit" class="btn btn-primary">Confirmar Pago</button>
      
      <a href="javascript:history.back()" class="btn btn-outline-primary">Volver</a>
    </form>
  </div>

  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
